<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body>
    <div class="container">
            <header>
                <h1>Lista de Tarefas</h1>
                <p>Faça sua programação de afazeres</p>
            </header>
            <main>
                <form class="adicionaTarefa" id="adicionaTarefa">
                    <input type="text" id="nome" placeholder="Adicionar uma tarefa...">
                    <input type="time" id="hora">
                    <button type="submit">Enviar</button>
                </form>
                <h2>Minhas tarefas</h2>
                <form class="filtro">
                    <button type="button" onclick="filtrar('todas')" data-filtro="todas" class="botaoAtivo">Todas</button>
                    <button type="button" onclick="filtrar('pendentes')" data-filtro="pendentes" class="botao">Pendentes</button>
                    <button type="button" onclick="filtrar('concluidas')" data-filtro="concluidas" class="botao">Concluídas</button>
                </form>
                <div class="tarefas">
                    <div class="tarefa">
                        <div class="descricao">
                            <input type="checkbox" name="concluido" id="idexemplo">
                            <label for="idexemplo">Revisar JavaScript</label>
                        </div>
                        <span class="horario">12:50</span>
                        <button type="button" class="excluir">Excluir</button>
                    </div>
                </div>
            </main>
            <footer>
                <p>X tarefas no total</p>
            </footer>
    </div>
    <script src="main.js"></script>
    <!--
    <input type="submit"> -> envia o formulário
    <button type="submit"> -> envia formulário
    <button type="button"> -> executa uma ação sem enviar formulário automaticamente
    <button type="reset">  -> restaura os campos do formulário
    event.preventDefault() -> impede a ação padrão de um evento
    formulario.reset() -> restaura os campos do formulário aos padrões iniciais do html
    -->
</body>
</html>
